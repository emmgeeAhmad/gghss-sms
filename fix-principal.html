<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fix Principal Login — GGHSS Singhpora Kalan</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#F6F1E4;color:#2A2A26;margin:0;padding:20px;max-width:520px;}
h1{font-size:20px;color:#1B3A5C;}
.note{background:#fff;border:1px solid #ddd;border-radius:6px;padding:14px;margin-bottom:16px;font-size:13.5px;line-height:1.7;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px;}
.field input{width:100%;padding:9px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box;font-size:14px;}
.btn{background:#1B3A5C;color:#fff;border:none;padding:12px 22px;border-radius:5px;font-size:15px;cursor:pointer;font-weight:600;width:100%;}
.btn:disabled{background:#999;}
#status{margin-top:16px;padding:12px;border-radius:5px;font-size:13.5px;white-space:pre-wrap;}
.status-ok{background:#e6f4ea;color:#1e7a34;}
.status-err{background:#fdecea;color:#b3261e;}
.status-info{background:#eaf1fb;color:#1B3A5C;}
</style>
</head>
<body>
<h1>Fix Principal Login</h1>
<div class="note">
This signs you in with your existing password, then makes sure your Principal record exists in the
shared database and is linked to your login. It does not create a new account or change your password.
</div>
<div class="field"><label>Username</label><input id="username" value="principal"></div>
<div class="field"><label>Email address</label><input id="email" type="email" value="gulshanmagray@gmail.com"></div>
<div class="field"><label>Your current password</label><input id="password" type="password"></div>
<button class="btn" id="goBtn">Sign in and fix my Principal record</button>
<div id="status"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCJmwNeRUXvT4nxOOutyt0kaSkLI9sFe5A",
  authDomain: "gghss-singhpora-kalan-sms.firebaseapp.com",
  projectId: "gghss-singhpora-kalan-sms",
  storageBucket: "gghss-singhpora-kalan-sms.firebasestorage.app",
  messagingSenderId: "1001470406359",
  appId: "1:1001470406359:web:b3c277b667da5263bb0a92",
  measurementId: "G-GRLC5GMK15"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const SCHOOL_DOC = db.collection('school').doc('main');

document.getElementById('goBtn').onclick = async ()=>{
  const btn = document.getElementById('goBtn');
  const statusEl = document.getElementById('status');
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if(!password){ statusEl.className='status-err'; statusEl.textContent='Please enter your password.'; return; }
  btn.disabled = true; btn.textContent = 'Working…';
  statusEl.className = 'status-info';
  statusEl.textContent = 'Signing in…';
  try{
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    statusEl.textContent = 'Linking your Principal record…';

    const snap = await SCHOOL_DOC.get();
    let DB = snap.exists ? snap.data() : {
      users:[], students:[], admissions:[], attendance:{}, marks:{}, certificates:[],
      reportCards:[], assignments:[], circulars:[], accountEntries:[], approvals:[]
    };
    if(!DB.users) DB.users = [];

    let principalRecord = DB.users.find(u=>u.role==='principal');
    if(!principalRecord){
      principalRecord = {id:'u_' + Math.random().toString(36).slice(2,9), username, role:'principal', name:'Principal'};
      DB.users.push(principalRecord);
    }
    principalRecord.username = username;
    principalRecord.email = email;
    principalRecord.authUid = uid;
    delete principalRecord.password;

    await db.collection('profiles').doc(uid).set({
      role:'principal', name:principalRecord.name, username, linkedId:principalRecord.id
    });
    await db.collection('usernameIndex').doc(username).set({email, uid});
    await SCHOOL_DOC.set(DB);

    await auth.signOut();
    statusEl.className = 'status-ok';
    statusEl.textContent = 'Done! Your Principal record is fixed. Open the main app and log in as usual — Manage Staff should now show you.';
    btn.textContent = 'Fixed';
  }catch(e){
    statusEl.className = 'status-err';
    statusEl.textContent = 'Failed: ' + e.message + (e.code ? ' (' + e.code + ')' : '');
    btn.disabled = false; btn.textContent = 'Sign in and fix my Principal record';
  }
};
</script>
</body>
</html>
